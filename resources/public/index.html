<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sudoku</title>
    <link href="css/style.css" rel="stylesheet" type="text/css">
    <link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script>
      (function () {
        try {
          var valid = ['system', 'dark', 'light'];
          var query = new URL(window.location.href).searchParams.get('theme');
          var stored = window.localStorage.getItem('sudoku-clojure.theme');
          var preference =
            valid.indexOf(query) >= 0 ? query
              : valid.indexOf(stored) >= 0 ? stored
                : 'system';
          var dark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          console.log(e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
    </div> <!-- end of app div -->
    <script src="cljs-out/dev-main.js" type="text/javascript"></script>
  </body>
</html>
